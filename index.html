<!DOCTYPE html>
<html lang="fr" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>FireCal Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'fire-red': '#ef4444',
              'fire-dark': '#1e293b',
              'fire-orange': '#f97316',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Base Style */
      body { 
        -webkit-tap-highlight-color: transparent; 
        overscroll-behavior-y: none; 
        transition: background 0.5s ease;
      }
      
      html.dark body {
        background: radial-gradient(circle at 0% 0%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        background-attachment: fixed;
      }

      html:not(.dark) body {
        background: radial-gradient(circle at 0% 0%, #f1f5f9 0%, #f8fafc 100%);
        background-attachment: fixed;
      }

      .leaflet-container { height: 100%; width: 100%; background: transparent; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Mesh Gradient Accents */
      .bg-glow-orange {
        background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, rgba(249, 115, 22, 0) 70%);
      }
      .bg-glow-blue {
        background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(59, 130, 246, 0) 70%);
      }

      /* Transitions for smooth theme switching */
      * {
        transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform;
        transition-duration: 300ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-leaflet": "https://esm.sh/react-leaflet@^5.0.0",
    "leaflet": "https://esm.sh/leaflet@^1.9.4",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
  <body class="text-slate-900 dark:text-slate-100 h-screen w-screen overflow-hidden font-sans select-none relative">
    <!-- Ambient backgrounds -->
    <div class="fixed top-[-10%] right-[-10%] w-[60%] h-[40%] bg-glow-orange pointer-events-none z-0"></div>
    <div class="fixed bottom-[-10%] left-[-10%] w-[60%] h-[40%] bg-glow-blue pointer-events-none z-0"></div>
    
    <div id="root" class="h-full w-full relative z-10"></div>
  </body>
</html>
